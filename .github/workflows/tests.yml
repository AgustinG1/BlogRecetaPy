name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  django-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=proyecto.settings_test

      - name: Run tests
        run: python manage.py test --settings=proyecto.settings_test --verbosity=2

  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: blogrecetapy_ci
          MYSQL_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_DATABASE: blogrecetapy_ci
      MYSQL_TEST_DATABASE: test_blogrecetapy_ci
      MYSQL_USER: root
      MYSQL_PASSWORD: test-password
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the complete suite on MySQL
        run: python manage.py test --settings=proyecto.settings_test_mysql --verbosity=2

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-browser.txt

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-browser.txt

      - name: Run browser flow
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: python manage.py test aplicacion.browser_e2e --settings=proyecto.settings_test --verbosity=2
